# The website (build/site) from text/*.usfm, published to GitHub Pages on every push to main and each v* tag.
name: Pages

on:
  push:
    branches: [main]
    paths: ["text/**", "pipeline/**", "data/versification/**", "data/witnesses/wikisource/MANIFEST.tsv", "scripts/install-texlive.sh", ".github/workflows/pages.yml"]
    tags: ["v*"]                               # a release (a release made by release.yml's token triggers nothing)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # the tags, for the edition label
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore TeX Live
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh') }}
      - name: Install TeX Live (LuaLaTeX, for the PDF offered on the site)
        run: |
          bash scripts/install-texlive.sh "$HOME/texlive"
          echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Fetch the texts offered beside the Latin (eBible.org, public domain)
        run: python -m pipeline fetch parallel kjv bsb web wlc tr lxx vulgate
      - name: Build the site and the downloads (EPUB, PDF, text) it offers
        run: |
          # a tag's own build is that edition; any later one says so ("v1.0+ (2026-11-11)")
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$tag" ] && [ "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" ]; then version="$tag"
          else version="${tag:+$tag+ }($(git log -1 --format=%cs))"; fi
          python -m pipeline build --version "$version"
          ls -l build/site/downloads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
