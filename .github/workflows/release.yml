# A release: push a tag v* and this builds every format from text/*.usfm (EPUBs checked with epubcheck, the PDF
# compiled with LuaLaTeX) and publishes them as the tag's GitHub release. The Pages workflow then rebuilds the site.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore TeX Live
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh') }}
      - name: Install epubcheck and TeX Live (LuaLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y epubcheck
          bash scripts/install-texlive.sh "$HOME/texlive"
          echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Fetch the texts offered beside the Latin on the site (eBible.org, public domain)
        run: python -m pipeline fetch parallel kjv bsb web wlc tr lxx vulgate
      - name: Build every format
        run: |
          python -m pipeline build --version "${GITHUB_REF_NAME}"
          if [ ! -f build/pdf/castellio.pdf ]; then tail -n 80 build/pdf/castellio.log || true; exit 1; fi
      - name: Check the EPUBs
        run: for f in build/epub/*.epub; do epubcheck "$f"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/site && zip -qr ../castellio-site.zip .)
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE.md \
            build/epub/*.epub build/pdf/castellio*.pdf build/txt/* build/castellio-site.zip
